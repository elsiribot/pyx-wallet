[package]
name = "conduit"
version = "0.6.0"
edition = "2024"

# cdylib for Android (cargo-ndk packages it as libconduit.so); rlib keeps
# `cargo test` and the iOS static-link path working.
[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(frb_expand)'] }

[features]
# Flutter remains the shipping bridge until the native Android implementation
# reaches parity.  JNI is deliberately opt-in so existing builds are unchanged.
default = ["flutter-bridge"]
flutter-bridge = ["dep:flutter_rust_bridge"]
android-jni = ["dep:jni"]

[dependencies]
fedimint-api-client = "0.11.0"
fedimint-bip39 = "0.11.0"
fedimint-core = "0.11.0"
fedimint-connectors = "0.11.0"
fedimint-client = "0.11.0"
fedimint-eventlog = "0.11.0"
fedimint-fountain = "0.11.0"
fedimint-rocksdb = "0.11.0"
fedimint-ln-client = "0.11.0"
fedimint-ln-common = "0.11.0"
fedimint-lnv2-client = "0.11.0"
fedimint-lnv2-common = "0.11.0"
fedimint-mint-client = "0.11.0"
fedimint-wallet-client = "0.11.0"
fedimint-client-module = "0.11.0"
fedimint-meta-client = "0.11.0"
fedimint-walletv2-client = "0.11.0"
fedimint-walletv2-common = "0.11.0"
fedimint-mintv2-client = "0.11.0"
fedimint-mintv2-common = "0.11.0"
bitcoin = "0.32.5"
lightning-invoice = { version = "0.33.2", features = ["std"] }
log = "0.4"
flutter_rust_bridge = { version = "=2.10.0", optional = true }
futures-util = "0.3.30"
async-stream = "0.3"
fedimint-lnurl = { git = "https://github.com/fedimint/fedimint" }
# Pin versions to avoid netwatch/socket2 incompatibility in fedimint 0.9.0
reqwest = { version = "=0.12.22", features = ["rustls-tls", "json"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
jni = { version = "0.21.1", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
regex = "1"
hyper-util = "=0.1.14"
surge-ping = "=0.8.2"
socket2 = "=0.5.9"
url = "2"
zeroize = "1"
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.dev.package]
tikv-jemalloc-sys = { opt-level = 3 }
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3}
secp256k1-sys = { opt-level = 3}

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = false
debug = "line-tables-only"

[profile.release.package]
tikv-jemalloc-sys = { opt-level = 3 }
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3}
secp256k1-sys = { opt-level = 3}
