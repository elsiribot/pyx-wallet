org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Nix installs this platform in flake.nix. A single value drives both
# compileSdk and targetSdk so the packaged target cannot drift from compilation.
pyx.androidSdk=36
