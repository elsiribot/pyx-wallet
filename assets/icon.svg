<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0B0D11"/>
  <defs>
    <!-- P: stem + solid bowl (no counter) -->
    <clipPath id="p">
      <path d="M324 262 H537 A162 162 0 0 1 537 586 H423 V800 H324 Z"/>
    </clipPath>
  </defs>
  <!-- Diagonal slices along x + 2.5y = c cut the P into three pieces; the two
       gaps are left unpainted so the backdrop shows through. -->
  <g clip-path="url(#p)">
    <polygon fill="#F7931A" points="2496,-500 -2504,1500 -3000,1500 -3000,-500"/>
    <polygon fill="#FFC978" points="2584,-500 3280,-500 -1720,1500 -2416,1500"/>
    <polygon fill="#F7931A" points="3368,-500 4500,-500 4500,1500 -1632,1500"/>
  </g>
</svg>
