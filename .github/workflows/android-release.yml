name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'ndk;28.2.13676358'
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked --version 4.1.2

      - name: Check and test standalone native core
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path rust/Cargo.toml \
            --no-default-features --features android-jni --all-targets -- -D warnings
          cargo test --locked --manifest-path rust/Cargo.toml \
            --no-default-features --features android-jni

      - name: Set up release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/keystore.p12
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.p12
          EOF

      - name: Build and certify Kotlin/Compose release APK
        run: tool/build-native-android.sh --release

      - name: Review native release security invariants
        run: >-
          tool/review-native-android-security.sh
          --apk android-native/app/build/outputs/apk/release/app-release.apk

      - name: Name APK after the commit
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::9}" >> "$GITHUB_ENV"
          mv android-native/app/build/outputs/apk/release/app-release.apk \
             "android-native/app/build/outputs/apk/release/pyx-wallet-${GITHUB_SHA::9}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyx-wallet-apk-${{ env.SHORT_SHA }}
          path: android-native/app/build/outputs/apk/release/pyx-wallet-*.apk

      - name: Create build release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ env.SHORT_SHA }}
          commit: ${{ github.sha }}
          name: 'Pyx Wallet ${{ env.SHORT_SHA }}'
          body: |
            Signed arm64 Kotlin/Jetpack Compose build of ${{ github.sha }}.

            ${{ github.event.head_commit.message }}

            Download the APK below and open it on your phone to install/update.
            It retains the production package identity and signing lineage.
          artifacts: 'android-native/app/build/outputs/apk/release/pyx-wallet-*.apk'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
