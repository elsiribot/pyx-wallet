name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Required for updating the rolling release

# A newer push supersedes any in-flight build of the same branch
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches the flake.nix dev shell; gradle 8.14.3 / AGP 8.11.1 /
          # Kotlin 2.2.20 in the repo are this version's minimums.
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk

      - name: Install Flutter Rust Bridge CLI
        run: |
          flutter_rust_bridge_codegen --version 2>/dev/null | grep -q 2.10.0 \
            || cargo install flutter_rust_bridge_codegen --version "2.10.0" --locked

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Flutter Rust Bridge bindings
        run: flutter_rust_bridge_codegen generate

      - name: Build Rust library for Android
        run: |
          ROOT="$(pwd)"
          JNI_LIBS_DIR="$ROOT/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_LIBS_DIR"

          cd "$ROOT/rust"
          # 16KB page alignment for Android 15+; --platform 24 because the
          # bundled RocksDB uses POSIX_MADV_* (API >= 23).
          RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384" \
            cargo ndk -t arm64-v8a --platform 24 build --release

          cp "$ROOT/rust/target/aarch64-linux-android/release/libconduit.so" "$JNI_LIBS_DIR/"

          # Bundle the matching C++ shared library from the NDK.
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI_LIBS_DIR/"

      - name: Set up release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/keystore.p12
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.p12
          EOF

      - name: Build Flutter APK
        # arm64 only: phones. The abiFilters in build.gradle.kts are ignored
        # by the Flutter gradle plugin; --target-platform is the working knob.
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/pyx-wallet.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyx-wallet-apk
          path: build/app/outputs/flutter-apk/pyx-wallet.apk

      - name: Update rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: 'Pyx Wallet (latest)'
          body: |
            Rolling build of the `main` branch — signed, arm64.
            Download `pyx-wallet.apk` below and open it on your phone to
            install/update (same signing key every build, so updates
            install over the previous version).
          artifacts: 'build/app/outputs/flutter-apk/pyx-wallet.apk'
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
