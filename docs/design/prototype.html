<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eric's Wallet — Fedimint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --bg:#0B0D11;
  --surface:#14171C;
  --surface-2:#1B1F26;
  --surface-3:#21262E;
  --border:#262B33;
  --border-strong:#3A4049;
  --text:#E8E6DF;     /* stone */
  --muted:#9499A1;    /* slate */
  --faint:#5A6069;    /* steel */
  --accent:#FF9410;   /* primary orange */
  --amber:#FFB020;
  --burnt:#FF5A1F;
  --moss:#687C4D;
  --teal:#2C8C76;
  --green:#46CF7C;
  --red:#FF6A4D;
  --display:'Space Grotesk',sans-serif;
  --ui:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--ui);
  background:
    radial-gradient(1200px 600px at 50% -10%, #15181d 0%, transparent 60%),
    var(--bg);
  color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;
  padding:28px 16px 40px;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:#000}

/* ===== Stage chrome ===== */
.stage-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;justify-content:center}
.stage-title{font-family:var(--display);font-weight:700;letter-spacing:-0.03em;font-size:22px;text-transform:uppercase}
.stage-sub{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.18em;border-left:1px solid var(--border-strong);padding-left:14px}

/* ===== Stage: device + control panel ===== */
.stage{display:flex;gap:26px;align-items:flex-start;justify-content:center;flex-wrap:wrap}

.controls{
  width:248px;background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:18px 18px 8px;align-self:flex-start;
}
.controls h3{
  font-family:var(--display);font-size:12px;text-transform:uppercase;letter-spacing:.16em;
  color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:9px;
}
.controls h3 svg{color:var(--accent)}
.ctl-sub{font-size:11px;color:var(--faint);letter-spacing:.02em;margin-bottom:12px;line-height:1.5}
.ctl{padding:15px 0;border-top:1px solid var(--border)}
.ctl-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ctl-label{font-size:13.5px;font-weight:600;color:var(--text)}
.ctl-val{font-family:var(--display);font-weight:600;font-size:13px;color:var(--accent)}
.ctl-note{font-size:10.5px;color:var(--faint);margin-top:8px;letter-spacing:.01em}
.ctl-note.live{color:var(--green)}
.dial-switch{
  width:44px;height:25px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);
  position:relative;cursor:pointer;flex:0 0 auto;transition:background .18s,border-color .18s;padding:0;
}
.dial-switch .knob{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--faint);transition:left .18s,background .18s}
.dial-switch.on{background:var(--accent);border-color:var(--accent)}
.dial-switch.on .knob{left:21px;background:#1a0e00}
.dial-range{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;margin-top:14px;
  background:linear-gradient(90deg,var(--accent) 0,var(--accent) var(--fill,70%),var(--surface-3) var(--fill,70%));cursor:pointer}
.dial-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--border-strong)}
.dial-range::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}

/* ===== Device ===== */
.device{
  width:390px;height:844px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:46px;
  padding:11px;
  box-shadow:0 0 0 2px #05070a, 0 40px 90px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.02);
  position:relative;
  max-width:100%;
}
.screen{
  position:relative;
  width:100%;height:100%;
  background:var(--bg);
  border-radius:36px;
  overflow:hidden;
  display:flex;flex-direction:column;
}
/* status bar */
.statusbar{
  height:46px;flex:0 0 46px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;font-size:14px;font-weight:600;color:var(--text);
  font-family:var(--display);
  z-index:5;
}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.statusbar .icons svg{display:block}

/* nav header inside screens */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 22px 14px}
.topbar h1{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:-0.02em}
.topbar.centered{position:relative}
.topbar.centered .left,.topbar.centered>div:last-child{min-width:42px;flex:0 0 auto;z-index:1}
.topbar.centered .topbar-title{
  position:absolute;left:0;right:0;top:6px;text-align:center;pointer-events:none;
  font-size:21px;line-height:38px;white-space:nowrap;
}
.topbar .left{display:flex;align-items:center;gap:12px}
.iconbtn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  transition:.15s;
}
.iconbtn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.iconbtn.bare{border:none;background:transparent}
.iconbtn.bare:hover{background:var(--surface)}

/* scroll body */
.body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 22px 26px;scrollbar-width:none;overflow-anchor:none}
.body::-webkit-scrollbar{display:none}

/* labels */
.label{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--faint);font-weight:600}
.section-label{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.section-label .label{color:var(--muted)}
.viewall{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;font-family:var(--ui)}

/* balance block */
.balance-wrap{padding:8px 0 4px}
.balance-row{display:flex;align-items:baseline;gap:10px}
.balance{font-family:var(--display);font-weight:700;font-size:46px;letter-spacing:-0.03em;line-height:1}
.balance .unit{font-size:18px;color:var(--muted);font-weight:500;letter-spacing:0}
.balance-fiat{color:var(--muted);font-size:15px;margin-top:10px;font-family:var(--display);font-weight:500}
.eye{margin-left:auto;align-self:center}

/* buttons */
.btn-row{display:flex;gap:12px;margin:20px 0 4px}
.btn{
  flex:1;border:none;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:15px;
  border-radius:13px;padding:15px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:.15s;color:var(--text);
}
.btn svg{display:block}
.btn-primary{background:var(--accent);color:#1a0e00}
.btn-primary:hover{background:#ffa838}
.btn-ghost{background:var(--surface);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn-wide{width:100%;flex:none}
.btn-lg{padding:17px;font-size:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* generic card */
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:16px;transition:.15s;
}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--border-strong);background:var(--surface-2)}
.card.active-fed{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* federation row */
.fed{display:flex;align-items:center;gap:13px}
.fed .avatar{flex:0 0 42px}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;overflow:hidden}
.logo-avatar{background:#0d1426;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-avatar img{display:block;object-fit:contain}
.fed .meta{flex:1;min-width:0}
.fed .name{font-weight:600;font-size:15px;font-family:var(--display);letter-spacing:-0.01em}
.fed .sub{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.on{background:var(--green)}.dot.off{background:var(--burnt)}.dot.warn{background:var(--amber)}
.s-on{color:var(--green)}.s-off{color:var(--burnt)}.s-warn{color:var(--amber)}
.chev{color:var(--faint);flex:0 0 auto}

/* activity / list rows */
.tx{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--border)}
.tx:last-child{border-bottom:none}
.tx .ic{position:relative;width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--muted)}
/* small asset badge on the corner of each entry's icon */
.tx-asset{position:absolute;bottom:-4px;right:-4px;width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:10px;border:2px solid var(--bg)}
.tx-asset.btc{background:var(--accent);color:#1a0e00}
.tx-asset.usd{background:var(--green);color:#06301a}
/* pending indicator: an accent arc that travels around the icon's rounded-rect edge
   (same path technique as the federation status ring, but spinning) */
.tx-ring{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);pointer-events:none;overflow:visible}
.tx-ring-track{fill:none;stroke:var(--surface-3);stroke-width:3}
.tx-ring-prog{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:22 78;animation:txspin 1.15s linear infinite}
@keyframes txspin{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.tx .t2 .pending-tag{color:var(--amber);font-weight:600}
.tx .info{flex:1;min-width:0}
.tx .t1{font-weight:600;font-size:14.5px}
.tx .t2{font-size:12px;color:var(--faint);margin-top:2px}
.tx .amt{text-align:right;font-family:var(--display);font-weight:600;font-size:14.5px;white-space:nowrap}
.tx .amt .u{font-size:11px;color:var(--faint);font-weight:500;margin-left:2px}
.amt.pos{color:var(--green)}.amt.neg{color:var(--red)}
/* swap rows: both legs stacked into the same row height (same amount font as other rows) */
.amt-swap{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.amt-swap .amt{line-height:1.18}

/* segmented toggle */
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:4px;gap:4px}
.seg button{
  flex:1;border:none;background:none;color:var(--muted);font-family:var(--ui);font-weight:600;
  font-size:14px;padding:11px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.seg button.on{background:var(--accent);color:#1a0e00}
.seg.sm button{padding:8px 12px;font-size:12.5px}
.seg.sm button.on{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--border-strong)}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#1a0e00;border-color:var(--accent)}

/* data rows (key/value) */
.drow{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--border)}
.drow:last-child{border-bottom:none}
.drow .k{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);font-weight:600}
.drow .v{font-weight:600;font-size:14.5px;font-family:var(--display)}

/* inputs */
.field{margin-top:16px}
.field > .label{display:block;margin-bottom:8px}
.input{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:15px;color:var(--text);font-family:var(--display);font-size:18px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.input input{background:none;border:none;color:var(--text);font-family:var(--display);font-size:18px;font-weight:600;flex:1;min-width:0;outline:none}
.input input::placeholder{color:var(--faint)}
.input .suffix{color:var(--muted);font-size:14px;font-weight:500}
.input.mono input,.input.mono{font-family:var(--display);font-size:15px;letter-spacing:0}

/* QR */
.qr-wrap{background:#fff;border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:center;position:relative;margin:0 auto 4px;width:100%;aspect-ratio:1}
.qr-wrap > svg{width:100%;height:100%;display:block}
.qr-bolt{position:absolute;width:50px;height:50px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #fff}
/* placeholder shown before an amount is entered (no code to encode yet) */
.qr-wrap.qr-empty{background:var(--surface);border:1px dashed var(--border-strong)}
.qr-ph{display:flex;flex-direction:column;align-items:center;gap:13px;color:var(--faint);text-align:center;padding:24px}
.qr-ph svg{width:48px;height:48px;opacity:.55}
.qr-ph span{font-size:13.5px;letter-spacing:.03em}
.qr-spinner{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--accent);animation:qrspin .8s linear infinite}
@keyframes qrspin{to{transform:rotate(360deg)}}

/* receive amount entry + currency selector */
.recv-amt-row{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:32px 0 6px;flex-wrap:nowrap}
/* sats equivalent under the amount; min-height reserves the row so the QR never shifts */
.recv-sub{text-align:center;color:var(--muted);font-family:var(--display);font-weight:500;font-size:14px;min-height:20px;line-height:20px;margin:0 0 26px}
.recv-amt-input{background:none;border:none;outline:none;color:var(--text);font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-0.03em;text-align:right;padding:0;min-width:18px}
.recv-amt-input::placeholder{color:var(--faint)}
.recv-unit{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-family:var(--display);font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px;cursor:pointer;transition:.15s;flex:0 0 auto;align-self:center}
.recv-unit:hover{border-color:var(--border-strong);color:var(--text)}
.recv-unit .chevd{font-size:13px;line-height:1;opacity:.7;margin-top:-3px}

/* code field: the copyable address/invoice with inline copy + share actions */
.code-field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:5px 5px 5px 16px;margin-top:16px;font-family:var(--display)}
.code-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;cursor:pointer;letter-spacing:0}
.code-acts{display:flex;align-items:center;gap:2px;flex:0 0 auto;border-left:1px solid var(--border);padding-left:5px}
.code-act{width:40px;height:40px;border:none;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:10px;transition:.15s}
.code-act:hover{background:var(--surface-2);color:var(--text)}
.code-act:active{opacity:.55}

/* currency picker (bottom-sheet layover) */
.cur-search-wrap{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.cur-search-wrap svg{color:var(--faint);flex:0 0 auto}
.cur-search{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-family:var(--ui);font-size:15px}
.cur-search::placeholder{color:var(--faint)}
.cur-list{max-height:44vh;overflow-y:auto;margin:0 -8px;padding:0 8px;scrollbar-width:none}
.cur-list::-webkit-scrollbar{display:none}
.cur-row{display:flex;align-items:center;gap:13px;width:100%;background:none;border:none;cursor:pointer;padding:11px 8px;border-radius:11px;text-align:left;font-family:var(--ui);transition:background .12s}
.cur-row:hover{background:var(--surface-2)}
.cur-row.on{background:var(--surface-2)}
.cur-flag{font-size:21px;width:28px;text-align:center;flex:0 0 auto;line-height:1}
.cur-flag.btc{color:var(--accent);font-family:var(--display);font-weight:700;font-size:18px}
.cur-code{font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--text);width:50px;flex:0 0 auto}
.cur-name{font-size:13.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cur-check{color:var(--accent);flex:0 0 auto;display:flex}
.cur-sep{height:1px;background:var(--border);margin:8px 8px}
.cur-empty{text-align:center;color:var(--faint);padding:26px;font-size:13.5px}

/* Send: address-book dropdown + gated amount */
.ab-drop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:14px;overflow:hidden auto;box-shadow:0 20px 46px -16px rgba(0,0,0,.78);max-height:300px;scrollbar-width:none}
.ab-drop::-webkit-scrollbar{display:none}
.ab-item{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;font-family:var(--ui)}
.ab-item:hover{background:var(--surface-3)}
.ab-add{color:var(--accent);font-weight:600;font-size:14px}
.ab-add svg{width:18px;height:18px;flex:0 0 auto}
.ab-sep{height:1px;background:var(--border)}
.ab-av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--surface-3);font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted)}
.ab-name{font-weight:600;font-size:14px}
.ab-addr{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ab-empty{padding:16px 14px;color:var(--faint);font-size:13px;text-align:center}
.input.is-disabled{opacity:.5}
.input .lock-ic{color:var(--faint);display:flex;align-items:center;margin-right:2px}
/* tappable amount-currency selector inside the amount input */
.send-unit{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--muted);font-family:var(--ui);font-size:14px;font-weight:500;cursor:pointer;padding:4px 2px;flex:0 0 auto}
.send-unit:hover{color:var(--text)}
.send-unit .chevd{font-size:12px;line-height:1;opacity:.7;margin-top:-2px}
.send-unit.locked{pointer-events:none;color:var(--muted)}
.send-unit.locked .chevd{display:none}
/* slide-to-send confirm control */
.slide-send{margin-top:26px;user-select:none;-webkit-user-select:none}
.slide-track{position:relative;height:58px;border-radius:15px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:background .25s}
.slide-label{font-family:var(--ui);font-weight:600;font-size:15px;color:var(--muted);pointer-events:none;letter-spacing:.02em}
.slide-knob{position:absolute;left:0;top:0;height:100%;width:66px;border-radius:14px;background:var(--accent);color:#1a0e00;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;transition:left .28s cubic-bezier(.22,.61,.36,1);box-shadow:0 6px 16px -6px rgba(255,148,16,.6)}
.slide-knob.dragging{transition:none;cursor:grabbing}
.slide-track.done{background:var(--green);border-color:var(--green)}
.slide-track.done .slide-knob{background:var(--green);color:#06301a;box-shadow:none}
.slide-track.done .slide-label{color:#06301a}
.slide-send.disabled{opacity:.45;pointer-events:none}

/* big amount display (receive) */
.big-amt{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-0.03em;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0}
.big-amt .unit{font-size:16px;color:var(--muted);font-weight:500}

/* badge */
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}

/* bottom nav */
.tabbar{
  flex:0 0 auto;display:flex;border-top:1px solid var(--border);background:var(--bg);
  padding:10px 8px 24px;
}
.tab{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint);font-family:var(--ui)}
.tab span{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.tab.on{color:var(--accent)}
.tab svg{display:block}

/* misc helpers */
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.mono{font-family:var(--display)}
.center{text-align:center}
.divider{height:1px;background:var(--border);margin:18px 0}
.spacer{height:18px}
.note-pill{width:36px;height:36px;border-radius:9px;border:1px solid var(--accent);background:rgba(255,148,16,.08);display:flex;align-items:center;justify-content:center;color:var(--accent);flex:0 0 auto}
.stat-grid{display:flex;gap:10px;margin-top:8px}

/* screen transition */
.body-anim{animation:slidein .26s cubic-bezier(.22,.61,.36,1)}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

.hint{margin-top:18px;font-size:11px;color:var(--faint);text-align:center;letter-spacing:.04em;max-width:390px}
.toast{
  position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
  padding:13px 20px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:0 18px 40px -12px rgba(0,0,0,.8)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--accent)}

/* ===== dual balance + collapsing header ===== */
/* opaque header that always occludes the list behind it, fading to transparent only at its
   bottom edge so rows dissolve gradually as they scroll underneath the preview */
.bal-sticky{position:sticky;top:0;z-index:4;min-height:98px;
  background:linear-gradient(to bottom, var(--bg) 0, var(--bg) calc(100% - 36px), transparent 100%)}
.bal-compact{position:absolute;left:0;right:0;top:0;height:54px;z-index:2;display:flex;align-items:center;gap:16px;opacity:0;pointer-events:none;cursor:pointer}
.c-asset{display:flex;align-items:center;gap:8px}
.c-asset .asset-sym{width:22px;height:22px;font-size:12px}
.c-val{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-0.02em;line-height:1}
.c-val .c-unit{font-size:12px;color:var(--muted);font-weight:500}
.c-div{width:1px;height:22px;background:var(--border);flex:0 0 auto}
.maskable{transition:opacity .15s ease}
.maskable.masking{opacity:0}
.bal-large{overflow:hidden;position:relative;z-index:1;overflow-anchor:none;will-change:max-height,opacity}
/* two first-class asset cards + exchange node */
.asset-stack{position:relative;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.asset-stack.solo{margin:24px 0 16px}   /* single BTC card: give it room top & bottom */
.asset-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 16px}
.asset-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.asset-badge{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:14px;flex:0 0 auto}
.asset-badge.btc{background:rgba(255,148,16,.16);color:var(--accent)}
.asset-badge.usd{background:rgba(70,207,124,.15);color:var(--green)}
.asset-opt{margin-left:auto;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);border:1px solid var(--border);padding:3px 7px;border-radius:6px}
/* symbol-in-front amount (no heading row) */
.asset-amt{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:700;font-size:31px;letter-spacing:-0.025em;line-height:1}
.asset-amt .unit{font-size:15px;color:var(--muted);font-weight:500;letter-spacing:0}
.asset-sym{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;border-radius:7px;font-size:15px;font-weight:700;flex:0 0 auto}
.asset-sym.btc{background:rgba(255,148,16,.16);color:var(--accent)}
.asset-sym.usd{background:rgba(70,207,124,.15);color:var(--green)}
.asset-fiat{color:var(--muted);font-size:13px;font-family:var(--display);font-weight:500;margin-top:8px}
.stable-tag{color:var(--faint);font-weight:500}
.asset-actions{display:flex;gap:10px;margin-top:14px}
.asset-btn{flex:0 0 auto;padding:10px 16px;font-size:14px;border-radius:11px}
.asset-btn svg{width:16px;height:16px}
.exchange-btn{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#1a0e00;
  border:5px solid var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;
  box-shadow:0 8px 20px -6px rgba(255,148,16,.55);transition:background .15s,transform .15s;
}
.exchange-btn svg{width:23px;height:23px}
.exchange-btn:hover{background:#ffa838;transform:translateY(-50%) scale(1.07)}
.act-group-label{display:flex;align-items:center;gap:14px;margin:24px 0 10px}
.act-group-label .label{color:var(--muted);flex:0 0 auto}
.act-group-label::after{content:"";flex:1 1 auto;height:1px;background:var(--border)}
.asset-pill{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border);padding:7px 13px 7px 8px;border-radius:10px;font-family:var(--ui)}
.asset-pill .asset-badge{width:20px;height:20px;font-size:12px;border-radius:6px}

/* exchange screen */
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
.ex-flip-wrap{position:relative;height:12px}
.ex-flip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:var(--surface-2);border:5px solid var(--bg);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:.15s}
.ex-flip:hover{border-color:var(--bg);background:var(--surface-3);transform:translate(-50%,-50%) rotate(180deg)}
.ex-amt-input{width:100%;background:none;border:none;outline:none;color:var(--text);font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-0.025em}
.ex-amt-input::placeholder{color:var(--faint)}

.fed-top{position:relative;overflow:visible;border:none}
.fed-top-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-family:var(--display);font-weight:700}
/* guardian status ring around the federation button */
.fed-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fed-ring-track{fill:none;stroke:var(--surface-3);stroke-width:3}
.fed-ring-prog{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .3s ease,stroke .3s ease}

.jump-top{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);
  background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
  padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;font-family:var(--ui);
  display:flex;align-items:center;gap:7px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:6;box-shadow:0 14px 34px -12px #000;
}
.jump-top.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}

/* overlaid QR scan button (home only; swaps out for the jump-to-top button) */
.scan-fab{
  position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
  width:58px;height:58px;border-radius:50%;border:none;
  background:var(--accent);color:#1a0e00;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s,filter .15s;
  z-index:6;box-shadow:0 16px 36px -10px rgba(255,148,16,.5),0 6px 16px -6px #000;
}
.scan-fab.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.scan-fab:hover{filter:brightness(1.07)}
.scan-fab:active{transform:translateX(-50%) scale(.94)}

/* QR scanner viewfinder */
.scanview{margin-top:10px;display:flex;flex-direction:column;align-items:center}
.scan-frame{position:relative;width:100%;aspect-ratio:1;border-radius:24px;background:radial-gradient(circle at 50% 38%,#10161f,#070a0e);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.cnr{position:absolute;width:34px;height:34px;border:3px solid var(--accent)}
.cnr.tl{top:14px;left:14px;border-right:none;border-bottom:none;border-radius:11px 0 0 0}
.cnr.tr{top:14px;right:14px;border-left:none;border-bottom:none;border-radius:0 11px 0 0}
.cnr.bl{bottom:14px;left:14px;border-right:none;border-top:none;border-radius:0 0 0 11px}
.cnr.br{bottom:14px;right:14px;border-left:none;border-top:none;border-radius:0 0 11px 0}
.scan-line{position:absolute;left:18px;right:18px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 12px 1px var(--accent);animation:scanmove 2.6s ease-in-out infinite}
@keyframes scanmove{0%,100%{top:7%}50%{top:91%}}
/* animated-QR capture progress (Ecash receive) */
.scan-progress{margin-top:26px}
.scan-progress-track{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.scan-progress-fill{height:100%;width:0;border-radius:999px;background:var(--accent);transition:width .4s linear}
.scan-progress-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--muted)}
/* Ecash claiming state (after the animated QR is fully captured) */
.claim-stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 8px 8px}
.claim-spin{width:56px;height:56px;border-radius:50%;border:4px solid var(--surface-3);border-top-color:var(--accent);animation:qrspin .8s linear infinite}
.claim-amt{font-family:var(--display);font-weight:700;font-size:42px;letter-spacing:-0.03em;line-height:1;margin-top:32px}
.claim-amt .unit{font-size:16px;color:var(--muted);font-weight:500;margin-left:3px}
.claim-fiat{color:var(--muted);font-family:var(--display);font-weight:500;font-size:15px;margin-top:11px}
.claim-status{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.05em;margin-top:20px}

/* empty transaction history placeholder */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:54px 24px 30px;color:var(--faint)}
.empty-ic{width:70px;height:70px;display:flex;align-items:center;justify-content:center;color:var(--faint);opacity:.5}
.empty-ic svg{width:70px;height:70px}
.empty-title{font-family:var(--display);font-weight:500;font-size:32px;color:var(--faint)}

/* federation modules */
.mod-list{display:flex;flex-wrap:wrap;gap:9px}
.mod-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:9px 13px 9px 11px;font-size:13.5px;font-weight:500}
.mod-pill svg{color:var(--accent);flex:0 0 auto}

/* guardian connection bottom sheet (scoped inside the device screen) */
.sheet-back{position:absolute;inset:0;background:rgba(4,6,9,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;backdrop-filter:blur(2px)}
.sheet-back.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:21;
  background:var(--surface);border-top:1px solid var(--border-strong);
  border-radius:26px 26px 0 0;padding:8px 22px 30px;
  transform:translateY(110%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -22px 55px -20px rgba(0,0,0,.75);
}
.sheet.show{transform:translateY(0)}
.sheet-grip{width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:6px auto 14px}

/* transaction rows are tappable; open the detail sheet */
.tx-tap{cursor:pointer}
.tx-tap:active{opacity:.6}

/* transaction detail sheet */
.tx-detail-head{text-align:center;margin:2px 0 18px}
.tx-detail-ic{width:54px;height:54px;border-radius:16px;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;margin:0 auto}
.tx-detail-ic.pos{color:var(--green)}
.tx-detail-type{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-0.01em;margin-top:12px}
.tx-detail-head .big-amt{margin:8px 0 2px}
.big-amt.pos{color:var(--green)}.big-amt.neg{color:var(--red)}
.tx-wrench{position:absolute;top:14px;right:18px;z-index:2}
.tx-wrench.active{color:var(--accent);border-color:var(--accent);background:var(--surface-2)}
/* technical block stays hidden until the wrench is toggled */
.tx-tech{display:none;margin-top:12px}
.sheet.show-tech .tx-tech{display:block}
.tx-tech-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:600;padding:13px 0 4px;border-bottom:1px solid var(--border)}
.tx-copy{background:none;border:none;font-family:var(--display);font-size:13.5px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;max-width:215px;padding:0}
.tx-copy-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-copy svg{flex:0 0 auto;width:14px;height:14px;color:var(--faint)}
.tx-copy:active{opacity:.6}

/* wallets switcher */
.wallet-prov{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;padding:0;cursor:pointer;font-family:var(--ui);color:var(--muted)}
.wallet-prov .avatar{flex:0 0 auto}
.wallet-prov-name{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.01em;color:var(--text)}
.wallet-prov .chev{margin-left:auto;width:16px;height:16px}
.wallet-prov:hover .wallet-prov-name{color:var(--accent)}
.wallet-ic{width:42px;height:42px;border-radius:12px;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.wallet-ic svg{width:21px;height:21px}
.card.wallet-on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.wallet-badge{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#1a0e00;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.wallet-badge svg{width:15px;height:15px}

/* biometric auth sheet */
.bio-sheet{text-align:center;padding:6px 4px 8px}
.bio-ring{width:88px;height:88px;border-radius:50%;margin:8px auto 20px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,rgba(255,148,16,.16),rgba(255,148,16,.02));border:1px solid var(--border-strong);color:var(--accent);transition:.3s}
.bio-ring svg{width:42px;height:42px}
.bio-ring.scanning{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 34px -6px rgba(255,148,16,.6);animation:biopulse 1.1s ease-in-out infinite}
.bio-ring.ok{border-color:var(--green);color:var(--green);box-shadow:0 0 0 1px var(--green),0 0 30px -8px rgba(70,207,124,.6);animation:none}
@keyframes biopulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.04);opacity:.82}}
.bio-title{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-0.01em}
.bio-sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin:8px 4px 22px}

/* seed phrase */
.seed-warn{display:flex;gap:11px;align-items:flex-start;background:rgba(255,106,77,.07);border:1px solid rgba(255,106,77,.32);border-radius:13px;padding:13px 14px;margin:4px 0 20px}
.seed-warn svg{flex:0 0 auto;color:var(--red);margin-top:1px}
.seed-warn span{font-size:12.5px;line-height:1.5;color:var(--text)}
.seed-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;transition:filter .25s}
.seed-grid.blur{filter:blur(7px)}
.seed-word{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 13px}
.seed-num{font-family:var(--display);font-size:11.5px;color:var(--faint);font-weight:600;min-width:17px;text-align:right}
.seed-w{font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:-0.01em}
.seed-reveal{position:absolute;inset:-4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;color:var(--text);font-size:13px;font-weight:600;border-radius:14px;background:rgba(11,13,17,.34)}
.seed-reveal svg{width:24px;height:24px;color:var(--accent)}
.seed-reveal:hover{color:var(--accent)}

/* quick-spend limit field */
.ql-field{display:flex;align-items:baseline;justify-content:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px 20px;transition:border-color .15s}
.ql-field:focus-within{border-color:var(--accent)}
.ql-input{background:none;border:none;outline:none;padding:0;color:var(--text);font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-0.03em;text-align:right;field-sizing:content;min-width:34px;max-width:220px}
.ql-input::placeholder{color:var(--faint)}
.ql-unit{font-family:var(--display);font-weight:500;font-size:18px;color:var(--muted)}

/* ===== Sandbox env: floating gear + backdrop (mobile only) ===== */
.env-fab{
  position:fixed;right:16px;bottom:88px;z-index:201;
  width:46px;height:46px;border-radius:50%;
  border:1px solid var(--border-strong);
  background:rgba(27,31,38,.55);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:var(--text);
  display:none;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 8px 22px -8px rgba(0,0,0,.7);
  transition:background .15s,transform .15s,opacity .2s;
}
.env-fab svg{width:22px;height:22px;opacity:.82;transition:transform .3s ease}
.env-fab:active{transform:scale(.92)}
.env-fab.open{background:rgba(255,148,16,.16);border-color:var(--accent);color:var(--accent)}
.env-fab.open svg{opacity:1;transform:rotate(60deg)}
.env-back{
  position:fixed;inset:0;z-index:199;display:none;
  background:rgba(4,6,9,.55);opacity:0;pointer-events:none;
  transition:opacity .25s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.env-back.open{opacity:1;pointer-events:auto}

/* ===== Mobile: render the prototype as a full-bleed native app ===== */
@media (max-width:640px){
  body{padding:0;min-height:100vh;min-height:100dvh;justify-content:flex-start}
  .stage-head,.hint{display:none}
  .statusbar{display:none}   /* drop the simulated status bar; the real OS one shows through */
  .stage{display:block;gap:0;width:100%}
  .device{
    width:100%;max-width:none;height:100vh;height:100dvh;
    border:none;border-radius:0;padding:0;box-shadow:none;
  }
  .screen{border-radius:0}

  /* the desktop side panel becomes a slide-up sandbox sheet */
  .controls{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
    z-index:200;align-self:auto;
    border-radius:22px 22px 0 0;
    border:1px solid var(--border-strong);border-bottom:none;
    max-height:84dvh;overflow-y:auto;scrollbar-width:none;
    padding:8px 22px 34px;
    transform:translateY(112%);
    transition:transform .34s cubic-bezier(.32,.72,0,1);
  }
  .controls::-webkit-scrollbar{display:none}
  .controls.open{transform:translateY(0)}
  .controls::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:6px auto 16px}

  .env-fab{display:flex}
  .env-back{display:block}
}
</style>
</head>
<body>

<div class="stage-head">
  <div class="stage-title">Eric's Wallet</div>
  <div class="stage-sub">Fedimint</div>
</div>

<div class="stage">
<div class="device">
  <div class="screen">
    <div class="statusbar">
      <span>9:41</span>
      <span class="icons">
        <!-- signal -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".4"/></svg>
        <!-- wifi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.5a1.3 1.3 0 100-2.6 1.3 1.3 0 000 2.6z"/><path d="M3.2 6.4a7 7 0 019.6 0l-1.3 1.4a5 5 0 00-7 0L3.2 6.4z" opacity=".9"/><path d="M.8 3.9a10.4 10.4 0 0114.4 0l-1.3 1.4a8.5 8.5 0 00-11.8 0L.8 3.9z" opacity=".55"/></svg>
        <!-- battery -->
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="2.5" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="18" height="7" rx="1.4" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <div class="topbar" id="topbar"></div>
    <div class="body" id="body"></div>
    <div class="sheet-back" id="sheetBack" onclick="closeSheet()"></div>

const $ = (s,r=document)=>r.querySelector(s);
// group the integer part in threes with a thin space; leave any decimals untouched
function fmtAmount(v){
  let s=String(v); const neg=s[0]==='-'; if(neg)s=s.slice(1);
  const dot=s.indexOf('.');
  let int=(dot<0?s:s.slice(0,dot)).replace(/\D/g,'');
  const dec=dot<0?'':s.slice(dot);                       // keeps the '.' and fractional digits
  int=int.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'-':'')+int+dec;
}
function fed(id){return FEDS.find(f=>f.id===id)}

function avatar(f,size){
  const s=size||42;
  if(f.logo){
    return `<div class="avatar logo-avatar" style="width:${s}px;height:${s}px"><img src="${f.logo}" alt="" style="width:${Math.round(s*0.74)}px;height:${Math.round(s*0.74)}px"></div>`;
  }
  return `<div class="avatar" style="width:${s}px;height:${s}px;background:linear-gradient(145deg,${f.color},${shade(f.color,-30)});color:#fff;font-size:${s*0.38}px">${f.emoji}</div>`;
}
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+p,g=(n>>8&255)+p,b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}

  return f.online
    ? `<span class="dot on"></span><span class="s-on">Online</span> · ${f.g[0]}/${f.g[1]} Guardians`
    : `<span class="dot off"></span><span class="s-off">Offline</span> · ${f.g[0]}/${f.g[1]} Guardians`;
}

// Render a real, scannable QR code for `data` using the qrcode-generator library.
// The surrounding .qr-wrap supplies the white quiet-zone padding, so we emit no
// internal margin and let CSS scale the SVG to fill the card.
function qr(data){
  if(typeof qrcode==='function'){
    try{
      const q=qrcode(0,'M');          // type 0 = auto-size to fit the data, ECC level M
      q.addData(String(data));
      q.make();
      return q.createSvgTag({cellSize:4,margin:0,scalable:true})
              .replace(/fill="black"/,'fill="#0B0D11"');   // match the dark brand ink
    }catch(e){/* fall through to placeholder grid */}
  }
  return qrFallback(String(data));
}
// last-resort static grid if the QR library failed to load (e.g. offline)
function qrFallback(seed){
  const n=21;let s=seed.split('').reduce((a,c)=>a*31+c.charCodeAt(0)&0xffffff,7);
  function rnd(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}
  const finder=(x,y)=>(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
  let rects='';const cell=200/n;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(finder(x,y))continue;
    if(rnd()>0.52)rects+=`<rect x="${(x*cell).toFixed(1)}" y="${(y*cell).toFixed(1)}" width="${cell.toFixed(1)}" height="${cell.toFixed(1)}"/>`;
  }
  function fpat(ox,oy){
    return `<rect x="${ox}" y="${oy}" width="${cell*7}" height="${cell*7}" rx="3"/>`
      +`<rect x="${ox+cell}" y="${oy+cell}" width="${cell*5}" height="${cell*5}" rx="2" fill="#fff"/>`
      +`<rect x="${ox+cell*2}" y="${oy+cell*2}" width="${cell*3}" height="${cell*3}" rx="1.5"/>`;
  }
  return `<svg width="200" height="200" viewBox="0 0 200 200" fill="#0B0D11">${rects}
     ${fpat(0,0)}${fpat(cell*(n-7),0)}${fpat(0,cell*(n-7))}</svg>`;
}

function toast(msg){
  const t=$('#toast');t.innerHTML=msg;t.classList.add('show');
  clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

function mountHomeScroll(){
  const body=$('#body'), large=$('#balLarge'),
        compact=$('#balCompact'), jump=$('#jumpTop'), scan=$('#scanFab');
  if(!large)return;
  const full=large.scrollHeight;
  const RANGE=Math.max(140, full*0.78);
  large.style.maxHeight=full+'px';
  // throttle to one write per frame and guard redundant writes so a scroll event
  // can't trigger a layout change that feeds back into another scroll event (flicker)
  let ticking=false, lastT=-1, lastScrolled=null;
  function apply(){
    ticking=false;
    const st=body.scrollTop;
    const t=Math.min(1, st/RANGE);
    if(Math.abs(t-lastT)>0.002){
      lastT=t;
      large.style.maxHeight=(full*(1-t)).toFixed(1)+'px';
      // sequenced hand-off at ~35% scroll: large fully gone before compact appears — never both at once
      large.style.opacity=(Math.max(0, 1-t*2.8)).toFixed(3);
      compact.style.opacity=(Math.max(0, t*1.555-0.555)).toFixed(3);
      compact.style.pointerEvents=t>0.5?'auto':'none';
    }
    // jump-to-top and the scan FAB share the bottom-centre slot: swap one for the other
    const scrolled=st>RANGE*0.85;
    if(scrolled!==lastScrolled){
      lastScrolled=scrolled;
      jump.classList.toggle('show', scrolled);
      scan.classList.toggle('show', !scrolled);
    }
  }
  function upd(){ if(!ticking){ ticking=true; requestAnimationFrame(apply); } }
  body.onscroll=upd;
  apply();
}

// live-update only the dependent regions so the amount input keeps focus
function updateRecvRegions(){
  const sub=$('#recvSub'); if(sub)sub.innerHTML=recvSubHtml();
  const z=$('#recvQrZone'); if(z)z.innerHTML=recvQrZone();
  const cc=$('#recvCodeCard'); if(cc)cc.innerHTML=recvCodeCard();

// a stable key for the current request: regenerate only when one of these changes
function curRecvKey(){return recvMethod+'|'+recvCur+'|'+recvAmount.trim();}
// called on every keystroke — show the placeholder and (re)arm the 1s idle timer
function onRecvAmt(el){
  recvAmount=el.value.replace(/\s/g,'');       // store the raw number (no separators)
  const shown=fmtAmount(recvAmount);           // re-render with thin-space grouping
  el.value=shown;
  el.size=Math.max(1,shown.length||1);
  try{const p=shown.length;el.setSelectionRange(p,p);}catch(e){}  // keep caret at the end
  clearTimeout(_recvTimer); _recvPendingKey='';
  // on-chain (and amountless LNURL/placeholder) need no generation — update live
  if(!recvAmountDerived()){ recvStatus='typing'; updateRecvRegions(); return; }
  if(recvStatus==='ready' && _recvKey===curRecvKey()){ updateRecvRegions(); return; }
  recvStatus='typing';                       // back to placeholder while typing
  updateRecvRegions();
  _recvTimer=setTimeout(commitRecv,1000);     // generate 1s after the last keystroke
}
// Enter / mobile "Done"/"Go" key — generate immediately, skipping the idle wait
function onRecvKey(e){ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); commitRecv(); } }
// commit the entered amount: enter the loading state, then resolve after ~1s of latency
function commitRecv(){
  if(!recvAmountDerived()) return;            // nothing to generate for on-chain / amountless
  if(recvStatus==='ready'   && _recvKey===curRecvKey()) return;        // already showing this code
  if(recvStatus==='loading' && _recvPendingKey===curRecvKey()) return; // already generating it
  recvStatus='loading';
  updateRecvRegions();
  startRecvLatency();
}
// simulate the round-trip to the federation / Lightning node before the code is ready
function startRecvLatency(){
  clearTimeout(_recvTimer);
  const key=_recvPendingKey=curRecvKey();
  _recvTimer=setTimeout(()=>{
    _recvKey=key; _recvPendingKey=''; recvStatus='ready';
    updateRecvRegions();
  },1000);
}
// method/currency changed via a control (not the keyboard): re-run generation with latency
function regenRecv(){
  clearTimeout(_recvTimer); _recvKey=''; _recvPendingKey='';
  recvStatus = recvAmountDerived() ? 'loading' : 'typing';   // only invoice/ecash show the spinner
}

/* ----- slide-to-send confirm control ----- */
function slideStart(e){
  const send=$('#slideSend'), track=$('#slideTrack'), knob=$('#slideKnob');
  if(!send||send.classList.contains('disabled')||track.classList.contains('done'))return;
  e.preventDefault();
  knob.classList.add('dragging');
  const max=track.clientWidth-knob.offsetWidth-6;          // 3px of inset each side
  const grab=e.clientX-knob.getBoundingClientRect().left;  // where inside the knob we grabbed
  const move=ev=>{
    const x=Math.max(0,Math.min(max, ev.clientX-track.getBoundingClientRect().left-grab));
    knob.style.left=x+'px';
    if(x>=max-1) finish();
  };
  const cleanup=()=>{
    knob.classList.remove('dragging');
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
  };
  const finish=()=>{
    cleanup(); track.classList.add('done'); knob.style.left=max+'px';
    const l=$('#slideLabel'); if(l)l.textContent=send.dataset.done||'Sending…';
    (window[send.dataset.action]||confirmSend)();   // data-action picks the handler
  };
  const up=()=>{ cleanup(); if(!track.classList.contains('done')) knob.style.left='0px'; };  // snap back
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
}

/* ----- destination parsing ----- */
// detect the destination type and any amount baked into a BOLT11 invoice
function bolt11Sats(s){
  const m=s.match(/^lnbc(\d+)([munp]?)1/);
  if(!m) return null;                                   // 'lnbc1…' = amountless
  const per={m:1e5,u:1e2,n:1e-1,p:1e-4};                // sats per unit; bare = whole BTC
  return Math.round(parseInt(m[1],10)*(per[m[2]]??1e8));
}
// `reusable` marks destinations worth saving to the address book (addresses, LNURLs,
// BOLT12 offers) vs single-use invoices (BOLT11, BOLT12 invoice)
function parseSendDest(str){
  const s=(str||'').trim(), low=s.toLowerCase();
  if(s.length<4) return {valid:false};
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return {valid:true,type:'lnaddr',reusable:true, amountSats:null};
  if(low.startsWith('lnurl'))              return {valid:true,type:'lnurl', reusable:true, amountSats:null};
  if(low.startsWith('lno'))                return {valid:true,type:'bolt12',reusable:true, amountSats:null};  // offer
  if(low.startsWith('lni'))                return {valid:true,type:'bolt12',reusable:false,amountSats:null};  // invoice
  if(low.startsWith('lnbc'))               return {valid:true,type:'bolt11',reusable:false,amountSats:bolt11Sats(low)};
  return {valid:false};
}

/* ----- amount gating ----- */
// reflect the destination onto the amount field: blocked → locked (invoice amount) → editable
function applySendDest(focusIfNeeded){
  const amt=$('#sendAmt'), wrap=$('#sendAmtWrap'), lock=$('#sendAmtLock');
  if(!amt)return;
  const d=parseSendDest(sendDest);
  if(!d.valid){
    sendAmtLocked=false;
    amt.value=''; amt.readOnly=false; amt.disabled=true; amt.placeholder='Enter a destination first';
    wrap.classList.add('is-disabled'); lock.style.display='none';
    applySendCur(); updateSendReady(); return;
  }
  wrap.classList.remove('is-disabled'); amt.disabled=false;
  if(d.amountSats!=null){                 // invoice already carries an amount → show, lock it (in sats)
    sendAmtLocked=true; sendCur='SATS';
    amt.value=fmtAmount(d.amountSats); amt.readOnly=true; amt.placeholder='';
    lock.style.display='';
  }else{                                   // address / LNURL / BOLT12 → user enters the amount
    if(sendAmtLocked) amt.value='';
    sendAmtLocked=false; amt.readOnly=false; amt.placeholder='0'; lock.style.display='none';
    if(focusIfNeeded) amt.focus();
  }
  applySendCur(); updateSendReady();
}
// sats equivalent of whatever is entered (or the locked invoice amount)
function satsForSend(){
  if(sendAmtLocked) return parseSendDest(sendDest).amountSats||0;
  const v=parseFloat(($('#sendAmt')?.value||'').replace(/[^0-9.]/g,''))||0;
  return Math.round(v*curRate(sendCur));
}
// keep the unit chip + the always-on sats line in sync with the selected currency
function applySendCur(){
  const u=$('#sendUnit'), amt=$('#sendAmt');
  if(u){
    u.classList.toggle('locked', sendAmtLocked);
    u.innerHTML = sendAmtLocked ? 'SATS' : `${sendCur}<span class="chevd">⌄</span>`;
  }
  if(amt && !sendAmtLocked) amt.inputMode = sendCur==='SATS' ? 'numeric' : 'decimal';
  updSendSub();
}
// always show the sats equivalent below the amount (reserve the line when empty)
function updSendSub(){
  const el=$('#sendSub'); if(!el)return;
  const s=satsForSend();
  el.innerHTML = s>0 ? `≈ ${fmtAmount(s)} sats` : '&nbsp;';
}
function onSendAmt(){
  const el=$('#sendAmt');
  if(el && !sendAmtLocked){               // live thin-space grouping while typing
    el.value=fmtAmount(el.value.replace(/\s/g,''));
    try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
  }
  updSendSub(); updateSendReady();
}
function sendReady(){
  if(sendAsset==='usd'){                    // need a recipient address and a positive amount
    const to=($('#sendTo')?.value||'').trim();
    const v=parseFloat(($('#sendAmt')?.value||'').replace(/[^0-9.]/g,''))||0;
    return to.length>3 && v>0;
  }
  if(!parseSendDest(sendDest).valid) return false;
  return satsForSend()>0;
}

/* ----- To-field address-book dropdown ----- */
function initials(n){return n.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();}
function buildSendDrop(q){
  const d=$('#abDrop'); if(!d)return;
  const query=(q||'').trim(), low=query.toLowerCase();
  const matches=addressBook().filter(c=>!low||c.name.toLowerCase().includes(low)||c.addr.toLowerCase().includes(low));
  // offer "add" once the typed value is saveable: any address for USD, a reusable
  // destination (not a single-use invoice) for Bitcoin
  const showAdd = query.length>0 && (sendAsset==='usd' ? query.length>3 : parseSendDest(query).reusable===true);
  let html='';
  if(showAdd){
    html+=`<div class="ab-item ab-add" onmousedown="event.preventDefault()" onclick="addToBook()">${I.addbox}<span>Add to address book</span></div>
           <div class="ab-sep"></div>`;
  }
  html += matches.length
    ? matches.map(c=>`<div class="ab-item" onmousedown="event.preventDefault()" onclick="pickContact('${c.addr}')">
        <span class="ab-av">${initials(c.name)}</span>
        <div style="min-width:0;flex:1"><div class="ab-name">${c.name}</div><div class="ab-addr">${c.addr}</div></div>
      </div>`).join('')
    : `<div class="ab-empty">No saved contacts match</div>`;
  d.innerHTML=html;
}

function hideSendDrop(){ const d=$('#abDrop'); if(d)d.style.display='none'; }

// drop a freshly-sent payment into the activity list as pending; it settles after 6s,
// during which a rotating arc spins around its icon
let _pendingTxN=0;
function addPendingSend(o){
  const id='pending'+(++_pendingTxN), usd=o.asset==='usd';
  const tx={
    id, kind:'sent', time:'Pending', pos:false, pending:true, status:'Pending', scls:'warn', date:'Just now', fee:'… sats',
    title: usd?'Stable Send':'Lightning Send',
    asset: usd?'usd':'btc',
    type:  usd?'ecash':'lightning',
    amt:   usd?('-'+o.usd):('-'+fmtAmount(o.sats)),
    unit:  usd?'USD':'SATS',
    fiat:  usd?('≈ '+fmtAmount(Math.round(parseFloat(o.usd||'0')*1577))+' sats')
             :('≈ €'+(o.sats*0.001175).toFixed(2)),
  };
  if(o.memo) tx.memo=o.memo;
  if(!usd && o.dest && o.dest.includes('@')) tx.lnaddr=o.dest;
  pushPendingTx(tx, 'Sent');
}
// register a pending tx, prepend it to Today, and settle the ring after 6s
function pushPendingTx(tx, settledStatus){
  TX_BY_ID[tx.id]=tx;
  let today=ACTIVITY.find(g=>g.group==='Today');
  if(!today){ today={group:'Today',items:[]}; ACTIVITY.unshift(today); }
  today.items.unshift(tx);
  setTimeout(()=>{                          // settle: clear the pending ring in place (no full re-render)
    tx.pending=false; tx.time='Just now'; tx.status=settledStatus; tx.scls='on';
    const row=document.querySelector(`.tx[data-tx="${tx.id}"]`);
    if(row){
      row.querySelector('.ic')?.classList.remove('pending');
      row.querySelector('.tx-ring')?.remove();
      const t2=row.querySelector('.t2'); if(t2)t2.textContent='Just now';
    }
  }, 6000);
}

// heading like "Lightning received" / "On-chain sent" / "Swap"
function txTypeLabel(t){
  const base={lightning:'Lightning',onchain:'On-chain',ecash:'Ecash',swap:'Swap'}[t.type]||'Transaction';
  if(t.type==='swap') return 'Swap';
  return base+(t.pos?' received':' sent');
}
// one detail row; pass mono+copy to render a truncated, tap-to-copy technical value
function txRowItem(k,v,opts={}){
  if(v==null||v==='') return '';
  if(opts.copy)
    return `<div class="drow"><span class="k">${k}</span><button class="v mono tx-copy" title="Copy" onclick="copyVal('${v.replace(/'/g,"\\'")}')"><span class="tx-copy-v">${v}</span>${I.copy}</button></div>`;
  return `<div class="drow"><span class="k">${k}</span><span class="v"${opts.style?` style="${opts.style}"`:''}>${v}</span></div>`;
}
function txUserRows(t){
  let r=txRowItem('Date',t.date);
  if(t.memo) r+=txRowItem('Note',t.memo);
  if(t.type==='lightning'){ r+=txRowItem('Gateway',t.gateway); r+=txRowItem('Lightning address',t.lnaddr); }
  if(t.type==='onchain')  { r+=txRowItem('Confirmations',t.conf); }
  if(t.type==='swap')     { r+=txRowItem('Rate',t.rate); }
  if(t.fee!=null) r+=txRowItem('Fee',t.fee);
  return r;
}
function txTechRows(t){
  const x=t.tech||{}; let r='';
  if(t.type==='lightning'){ r+=txRowItem('Invoice',x.invoice,{copy:1}); r+=txRowItem('Payment hash',x.hash,{copy:1}); r+=txRowItem('Preimage',x.preimage,{copy:1}); }
  if(t.type==='onchain'){ r+=txRowItem('Address',x.address,{copy:1}); r+=txRowItem('Transaction ID',x.txid,{copy:1}); r+=txRowItem('Fee rate',x.feeRate); r+=txRowItem('TX size',x.vsize); r+=txRowItem('Block',x.block); }
  if(t.type==='ecash'){ r+=txRowItem('Ecash notes',x.notes,{copy:1}); r+=txRowItem('Denominations',x.denoms); }
  if(t.type==='swap'){ r+=txRowItem('Execution price',x.price); r+=txRowItem('Pool epoch',x.round); }
  r+=txRowItem('Operation ID',x.opId,{copy:1});
  if(x.error) r+=txRowItem('Error',`<span class="s-off">${x.error}</span>`);
  return r;
}
function openTxDetail(id){
  const t=TX_BY_ID[id]; if(!t)return;
  const sheet=$('#sheet'), back=$('#sheetBack');
  sheet.classList.remove('show-tech');   // always start collapsed
  const big = t.kind==='swap'
    ? `<div class="big-amt pos">${maskNum(t.in.amt,'•••')}<span class="unit">${t.in.unit}</span></div>
       <div class="faint" style="font-size:13px">from ${maskNum(t.out.amt,'•••')} ${t.out.unit}</div>`
    : `<div class="big-amt ${t.pos?'pos':'neg'}">${maskNum(t.amt,'•••')}<span class="unit">${t.unit}</span></div>
       ${t.fiat?`<div class="faint" style="font-size:13px">${maskNum(t.fiat,'••••')}</div>`:''}`;
  const tech=txTechRows(t);
  sheet.innerHTML=`
    <div class="sheet-grip"></div>
    ${tech?`<button class="iconbtn tx-wrench" title="Technical details" onclick="toggleTxTech(this)">${I.wrench}</button>`:''}
    <div class="tx-detail-head">
      <div class="tx-detail-ic ${t.pos?'pos':''}">${txIcon(t.kind)}</div>
      <div class="tx-detail-type">${txTypeLabel(t)}</div>

      <span class="badge" style="margin-top:10px"><span class="dot ${t.scls}"></span> ${t.status}</span>
    </div>
    <div class="card" style="padding:2px 16px">${txUserRows(t)}</div>
    ${tech?`<div class="card tx-tech" style="padding:2px 16px">
      <div class="tx-tech-label">Technical details</div>
      ${tech}
    </div>`:''}`;
  back.classList.add('show');
  sheet.classList.add('show');
}

/* ---- Biometric auth gate (OS biometrics are the only access method) ---- */
let _authCb=null;
function requireAuth(reason,onSuccess){
  _authCb=onSuccess;
  const sheet=$('#sheet'), back=$('#sheetBack');
  sheet.innerHTML=`
    <div class="sheet-grip"></div>
    <div class="bio-sheet">
      <div class="bio-ring" id="bioRing">${I.bio}</div>
      <div class="bio-title" id="bioTitle">Confirm it's you</div>
      <div class="bio-sub" id="bioSub">${reason||'Authenticate with your device biometrics to continue.'}</div>
      <button class="btn btn-primary btn-wide" id="bioBtn" onclick="runAuth()">Use biometrics</button>
      <button class="btn btn-ghost btn-wide" style="margin-top:10px" onclick="closeSheet()">Cancel</button>
    </div>`;
  back.classList.add('show');
  sheet.classList.add('show');
}
function runAuth(){
  const ring=$('#bioRing'), btn=$('#bioBtn'), title=$('#bioTitle'), sub=$('#bioSub');
  if(!ring)return;
  ring.classList.add('scanning'); btn.disabled=true;
  title.textContent='Scanning…'; sub.textContent='Hold still while your device verifies you.';
  // simulate the OS biometric round-trip, then hand control back to the caller
  setTimeout(()=>{
    ring.classList.remove('scanning'); ring.classList.add('ok'); ring.innerHTML=I.check;
    title.textContent='Verified';
    setTimeout(()=>{ closeSheet(); const cb=_authCb; _authCb=null; if(cb)cb(); },520);
  },1050);
}

/* ---- Backup → auth gate → recovery phrase ---- */
let _seedShown=false;
function openBackup(){
  _seedShown=false;                 // always re-blur the words for each reveal
  requireAuth('Authenticate to reveal your recovery phrase.', ()=>go('seed'));
}
SCREENS.seed=()=>({
  title:'Recovery Phrase',
  center:true,
  html:`
    <div class="seed-warn">${I.warn}<span>Anyone with these 12 words can spend your funds. Write them down, store them offline, and never share or screenshot them.</span></div>
    <div style="position:relative">
      <div class="seed-grid ${_seedShown?'':'blur'}" id="seedGrid">
        ${SEED_PHRASE.map((w,i)=>`<div class="seed-word"><span class="seed-num">${i+1}</span><span class="seed-w">${w}</span></div>`).join('')}
      </div>
      ${_seedShown?'':`<div class="seed-reveal" onclick="revealSeed()">${I.eye}<span>Tap to reveal</span></div>`}
    </div>
    <button class="btn btn-ghost btn-wide" style="margin-top:20px"${_seedShown?'':' disabled'} onclick="copy('${SEED_PHRASE.join(' ')}')">${I.copy}Copy to clipboard</button>
    <button class="btn btn-primary btn-wide" style="margin-top:10px" onclick="back()">I've written it down</button>
  `,
});
function revealSeed(){_seedShown=true;render();}

/* ---- Access Control (device biometrics only — no app PIN) ---- */
let REQUIRE_UNLOCK=true;
SCREENS.access=()=>({
  title:'Access Control',
  center:true,
  html:`
    <p style="color:var(--muted);font-size:13px;line-height:1.55;margin:6px 2px 18px">This wallet unlocks with your device's built-in security. There is no separate app PIN — your operating system's biometrics keep the keys tied to the hardware.</p>
    <div class="section-label"><span class="label">Method</span></div>
    <div class="card" style="padding:14px 16px">
      <div class="fed">
        <div class="wallet-ic">${I.bio}</div>
        <div class="meta">
          <div class="name">Device biometrics</div>
          <div class="sub">Face ID · Touch ID · fingerprint</div>
        </div>
        <span class="s-on" style="font-size:12px;font-weight:600;letter-spacing:.02em">Active</span>
      </div>
    </div>
    <div class="card" style="padding:2px 16px;margin-top:12px">
      <div class="drow">
        <span style="font-size:14.5px;color:var(--text);font-weight:500">Require unlock on open</span>
        <button class="dial-switch ${REQUIRE_UNLOCK?'on':''}" role="switch" aria-checked="${REQUIRE_UNLOCK}" onclick="toggleUnlock()"><span class="knob"></span></button>
      </div>
    </div>
    <div class="card" style="margin-top:18px;display:flex;gap:11px;align-items:flex-start;background:var(--surface-2)">
      ${I.info}<span style="font-size:12.5px;line-height:1.5;color:var(--muted)">App PIN and password unlock are not available — only your operating system's biometric authentication is supported.</span>
    </div>
  `,
});
function toggleUnlock(){REQUIRE_UNLOCK=!REQUIRE_UNLOCK;render();}

/* ---- Quick-spend limit (amount allowed without authentication) ---- */
let QUICK_LIMIT=20;     // committed display fiat (EUR); payments up to this skip biometric auth
let _quickDraft=20;     // in-progress edit, only applied after biometric auth
function quickSub(v){return v>0?'No authentication needed up to this amount':'Every payment requires authentication';}
SCREENS.limit=()=>{
  _quickDraft=QUICK_LIMIT;                 // start each visit from the committed value
  return {
    title:'Quick-spend limit',
    center:true,
    html:`
      <p style="color:var(--muted);font-size:13px;line-height:1.55;margin:6px 2px 24px">Payments up to this amount go through instantly. Anything above it asks for your device biometrics first.</p>
      <div class="ql-field">
        <input id="qlInput" class="ql-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="${fmtAmount(QUICK_LIMIT)}" placeholder="0" oninput="editQuickLimit(this)">
        <span class="ql-unit">EUR</span>
      </div>
      <div class="balance-fiat" id="qlSub" style="text-align:center;margin-top:14px">${quickSub(QUICK_LIMIT)}</div>
      <button class="btn btn-primary btn-wide" id="qlSave" style="margin-top:24px" disabled onclick="saveQuickLimit()">${I.lock}Update limit</button>
      <div class="card" style="margin-top:18px;display:flex;gap:11px;align-items:flex-start;background:var(--surface-2)">
        ${I.info}<span style="font-size:12.5px;line-height:1.5;color:var(--muted)">The limit applies per payment. Raising it trades security for convenience — larger sends are always protected by biometrics.</span>
      </div>
    `,
  };
};
function editQuickLimit(input){
  _quickDraft=parseFloat((input.value||'').replace(/[^\d.]/g,''))||0;
  const sub=$('#qlSub'); if(sub)sub.textContent=quickSub(_quickDraft);
  const btn=$('#qlSave'); if(btn)btn.disabled=(_quickDraft===QUICK_LIMIT);
}
function saveQuickLimit(){
  if(_quickDraft===QUICK_LIMIT)return;     // nothing to change
  requireAuth('Authenticate to change your quick-spend limit.', ()=>{
    QUICK_LIMIT=_quickDraft;
    toast('Quick-spend limit updated');
    render();
  });
}

/* clipboard */
function copy(t){
  if(navigator.clipboard)navigator.clipboard.writeText(t).catch(()=>{});
  toast('Copied to clipboard');
}

/* ---- control dials (sandbox the federation's capabilities) ---- */
function switchHtml(key){
  return `<button class="dial-switch ${CONFIG[key]?'on':''}" role="switch" aria-checked="${CONFIG[key]}" onclick="toggleConfig('${key}')"><span class="knob"></span></button>`;
}
function renderControls(){
  const el=$('#controls'); if(!el)return;
  el.innerHTML=`
    <h3>${I.dial} Federation Sandbox</h3>
    <div class="ctl-sub">Simulate what this federation supports.</div>

    <div class="ctl">
      <div class="ctl-top"><span class="ctl-label">Stable balance module</span>${switchHtml('stable')}</div>
      <div class="ctl-note live">${CONFIG.stable?'USD asset enabled in wallet':'BTC-only wallet'}</div>
    </div>

    <div class="ctl">
      <div class="ctl-top"><span class="ctl-label">Online guardians</span><span class="ctl-val" id="gval">${CONFIG.guardians} / 7</span></div>
      <input type="range" min="0" max="7" value="${CONFIG.guardians}" class="dial-range" style="--fill:${CONFIG.guardians/7*100}%" oninput="setGuardians(this)">
      <div class="ctl-note live">Drives the federation status ring</div>
    </div>

    <div class="ctl">
      <div class="ctl-top"><span class="ctl-label">Transaction history</span>${switchHtml('history')}</div>
      <div class="ctl-note live">${CONFIG.history?'Showing recent activity':'Empty wallet — placeholder shown'}</div>
    </div>

    <div class="ctl">
      <div class="ctl-top"><span class="ctl-label">LNURL support</span>${switchHtml('lnurl')}</div>
      <div class="ctl-note">Not wired to UI yet</div>
    </div>`;
}
/* mobile sandbox sheet: gear toggles the simulated-env controls panel */
function openEnv(){
  $('#controls')?.classList.add('open');
  $('#envBack')?.classList.add('open');
  $('#envFab')?.classList.add('open');
}
function closeEnv(){
  $('#controls')?.classList.remove('open');
  $('#envBack')?.classList.remove('open');
  $('#envFab')?.classList.remove('open');
}
function toggleEnv(){
  $('#controls')?.classList.contains('open') ? closeEnv() : openEnv();
}
function toggleConfig(key){
  CONFIG[key]=!CONFIG[key];
  renderControls();
  if(key==='stable'||key==='history'||key==='lnurl') render();   // these drive the wallet UI
}
function setGuardians(input){
  CONFIG.guardians=parseInt(input.value);
  input.style.setProperty('--fill', (CONFIG.guardians/7*100)+'%');
  const g=$('#gval'); if(g)g.textContent=CONFIG.guardians+' / 7';
  const ring=$('#fedRingProg');   // live-update the federation status ring if it's on screen
  if(ring){
    ring.setAttribute('stroke-dasharray', (CONFIG.guardians/7*100).toFixed(2)+' 100');
    ring.setAttribute('stroke', guardianColor(CONFIG.guardians));
  }
  // the federation detail page reflects the live guardian count too (keep scroll position)
  if(stack[stack.length-1].id==='fed-details'){
    const sc=$('#body').scrollTop; render(); const b=$('#body'); if(b)b.scrollTop=sc;
  }
}

/* boot (supports #screen or #tab/screen deep-links for preview) */
(function boot(){
  const h=decodeURIComponent(location.hash.replace(/^#/,''));
  if(h){
    const parts=h.split('/');
    if(TAB_ROOT[parts[0]]){curTab=parts[0];stack=[{id:TAB_ROOT[parts[0]],p:{}}];parts.shift();}
    if(parts[0]&&SCREENS[parts[0]]){
      const p={};
      if(parts[0]==='fed-details')p.id=parts[1]||'gbf';
      if(parts[0]==='guardians')p.id=parts[1]||'gbf';
      if(parts[0]==='receive'||parts[0]==='send')p.asset=parts[1]||'btc';
      stack.push({id:parts[0],p});
    }
  }
  renderControls();
  render();
})();
</script>
